<div class="bg-white p-6 rounded-xl shadow-lg">
      <h2 class="text-3xl font-bold text-gray-800 mb-6">Levels Management</h2>
      
      <div *ngIf="levels.length > 0" class="space-y-4">
        <div *ngFor="let level of levels" class="p-4 border rounded-lg bg-gray-50">
          <p class="font-semibold text-lg">{{ level.levelName }}</p>
          <p class="text-sm text-gray-500">ID: {{ level.id }}</p>
        </div>
      </div>
      <div *ngIf="levels.length === 0" class="text-gray-500">
        No levels found.
      </div>

    </div>
